<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#eef1f5" />
<title>영어 4선 칠판</title>
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="4선 칠판" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fff'/%3E%3Cg stroke='%238f9bab' stroke-width='1.6'%3E%3Cpath d='M3 7h26M3 25h26'/%3E%3C/g%3E%3Cpath d='M3 13h26' stroke='%23b6c3d2' stroke-width='1.2'/%3E%3Cpath d='M3 19h26' stroke='%234a9fd8' stroke-width='1.6'/%3E%3Ctext x='16' y='19' font-family='Georgia,serif' font-size='15' text-anchor='middle' fill='%231b2027'%3EAa%3C/text%3E%3C/svg%3E" />
<style>
  @font-face { font-family:Andika; src:url('./fonts/Andika-Regular.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face { font-family:Andika; src:url('./fonts/Andika-Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }
  @font-face { font-family:Pretendard; src:url('./fonts/Pretendard-Bold.woff2') format('woff2'); font-weight:700 900; font-display:swap; }

  :root{
    --bg:#eef1f5; --paper:#fff; --ink:#1b2027; --muted:#79838f; --hair:#e3e8ee;
    --accent:#eb6536; --accent-soft:#fff1ea;
    --l-outer:#8f9bab; --l-x:#b6c3d2; --l-base:#4a9fd8;
    --F:64px; --band:120px; --gpos:0 0; --shift:0px;
    --pen:#1b2027;
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }   /* .grp{display:flex} would otherwise win */
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  button,input,select{ font:inherit; color:inherit; }
  button{ cursor:pointer; border:0; background:none; }

  /* ---------- toolbar ---------- */
  .bar{
    height:60px; background:var(--paper); border-bottom:1px solid var(--hair);
    display:flex; align-items:center; gap:14px; padding:0 16px;
    overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; white-space:nowrap;
  }
  .grp{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .grp + .grp{ border-left:1px solid var(--hair); padding-left:14px; }
  .grp.end{ margin-left:auto; border-left:0; padding-left:0; }
  .lbl{ color:var(--muted); font-size:12px; font-weight:700; flex:0 0 auto; }
  .title{ border:0; outline:0; background:transparent; font-size:19px; font-weight:800; letter-spacing:-.03em; width:190px; min-width:120px; }
  .title::placeholder{ color:#b7bfc9; }

  .btn{ height:38px; min-width:38px; padding:0 12px; border-radius:10px; background:#f2f5f8; color:#4b5563; font-size:14px; font-weight:650; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn:hover{ background:#e6ecf2; }
  .btn[aria-pressed="true"], .btn.on{ background:var(--accent); color:#fff; }
  .btn.ghost{ background:transparent; }
  .btn:disabled{ opacity:.38; cursor:default; }

  .seg{ display:flex; background:#f2f5f8; border-radius:11px; padding:3px; gap:2px; }
  .seg button{ height:32px; padding:0 13px; border-radius:8px; font-size:14px; font-weight:700; color:#5b6673; }
  .seg button[aria-pressed="true"]{ background:var(--paper); color:var(--accent); box-shadow:0 1px 3px #0000001f; }

  .swatch{ width:28px; height:28px; border-radius:50%; border:2px solid transparent; padding:0; }
  .swatch span{ display:block; width:100%; height:100%; border-radius:50%; box-shadow:inset 0 0 0 1px #00000018; }
  .swatch[aria-pressed="true"]{ border-color:var(--accent); }
  .nib{ width:34px; height:34px; border-radius:9px; background:#f2f5f8; display:grid; place-items:center; }
  .nib i{ display:block; background:#4b5563; border-radius:50%; }
  .nib[aria-pressed="true"]{ background:var(--accent); } .nib[aria-pressed="true"] i{ background:#fff; }

  .rng{ width:96px; accent-color:var(--accent); }
  .sel{ height:38px; border:1px solid #dbe2e9; background:var(--paper); border-radius:10px; padding:0 9px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#3fae7c; transition:.25s; }
  .dot.pending{ background:#e0b23c; }

  /* ---------- stage ---------- */
  .stage{ height:calc(100% - 60px); overflow:auto; overscroll-behavior:contain; padding:18px 20px 26px; scroll-snap-type:y proximity; }
  .sheet{ position:relative; background:var(--paper); border:1px solid var(--hair); border-radius:8px; box-shadow:0 10px 30px #1b20270d; padding:14px 26px 20px; min-height:100%; }

  .row{ position:relative; display:flex; flex-direction:column; justify-content:center; padding:16px 0; min-height:var(--page-row-height, auto); }
  /* 표시 줄 수 groups rows into scroll-snap pages of N: only the first row of
     each group is a snap point, so scrolling settles on page boundaries
     instead of every single sentence once N > 1. */
  .row.snapPoint{ scroll-snap-align:start; }
  .row + .row{ border-top:1px dashed #eaeef3; }

  .rowline{ display:flex; align-items:stretch; gap:12px; }
  .rowbody{ flex:1 1 auto; min-width:0; }

  .speakBtns{
    flex:0 0 52px; align-self:flex-start; margin-top:6px;
    display:flex; flex-direction:column; gap:6px;
  }

  .speakBtn{
    width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:12px; font-weight:900;
    letter-spacing:.02em;
    display:grid; place-items:center; box-shadow:0 4px 12px #eb653645;
    transition:filter .12s, transform .12s;
  }
  .speakBtn:hover{ filter:brightness(1.07); }
  .speakBtn:active{ transform:scale(.94); }
  body.mode-draw .speakBtns{ display:none; }
  .speakBtn.speaking{ animation:speakPulse 1s ease-in-out infinite; }
  @keyframes speakPulse{ 0%,100%{ box-shadow:0 4px 12px #eb653645; } 50%{ box-shadow:0 4px 22px #eb6536a0; } }
  @media (prefers-reduced-motion:reduce){ .speakBtn.speaking{ animation:none; outline:3px solid #eb653690; } }

  /* Andika's own line-height metrics force a huge half-leading gap if the CSS
     line-height is set to the tight spacing we actually want — the browser's
     centering model and a small gap are fundamentally incompatible. So the
     truth (line-height = TILE, large) stays internal to .guide, and .ruleClip
     shows only a small, fixed-height window onto it: .guide is pulled up by
     --shift (a relative-position offset, so editing/selection still work
     normally) until its cap-line lands right at the window's own top edge. */
  .ruleClip{ position:relative; overflow:hidden; }
  .guide{
    font-family:Andika,Georgia,"Times New Roman",serif; font-weight:400;
    font-size:var(--F); line-height:var(--band);
    position:relative; top:var(--shift);
    outline:0; padding:0 .12em; margin:0;
    background-image:
      linear-gradient(var(--l-outer) 0 2px, transparent 2px),
      linear-gradient(var(--l-x)     0 1.5px, transparent 1.5px),
      linear-gradient(var(--l-base)  0 2px, transparent 2px),
      linear-gradient(var(--l-outer) 0 2px, transparent 2px);
    background-repeat:repeat-y;
    background-size:100% var(--band);
    background-position:var(--gpos);
    background-origin:border-box;
    caret-color:var(--accent);
    word-break:break-word;
    -webkit-user-modify:read-write-plaintext-only;
  }
  .guide:empty::before{ content:attr(data-ph); color:#c3cbd5; }

  .ko{
    /* Fixed — independent of the sentence-size slider — so the Korean gloss
       stays a stable, comfortable size no matter how the English ruling is
       resized. Only the viewport width nudges it, so it still fits phones. */
    font-family:Pretendard,system-ui,sans-serif; font-weight:800;
    font-size:clamp(32px, 5.6vw, 54px); line-height:1.3; color:#3a4451;
    outline:0; margin:10px 0 0; padding:2px 4px; border-radius:6px; min-height:1.3em;
    word-break:break-word;
  }
  .ko:empty::before{ content:attr(data-ph); color:#c3cbd5; }
  .ko:focus{ background:#f6f8fb; }

  .rowtools{
    position:absolute; top:4px; right:4px; z-index:6;
    display:flex; align-items:center; gap:6px;
    background:#ffffffec; border:1px solid var(--hair); border-radius:11px;
    padding:5px 8px; box-shadow:0 2px 8px #1b20270f;
  }
  body.mode-draw .rowtools{ display:none; }
  .rowtools .num{ color:#aab3be; font-size:11px; font-weight:800; min-width:16px; }
  .rowtools .rng{ width:74px; }
  .rowtools button{ width:28px; height:28px; border-radius:8px; color:#65707d; font-size:14px; }
  .rowtools button:hover{ background:var(--accent-soft); color:var(--accent); }

  /* ---------- ink ---------- */
  #ink{ position:absolute; inset:0; z-index:4; touch-action:none; pointer-events:none; }
  body.mode-draw-b #ink{ pointer-events:auto; cursor:crosshair; }
  body.mode-draw-a #ink{ pointer-events:none; }
  body.mode-draw-a .ruleClip{ touch-action:none; cursor:crosshair; }
  body.mode-draw .guide, body.mode-draw-b .ko{ -webkit-user-modify:read-only; user-select:none; }
  body.mode-draw .stage{ overscroll-behavior:none; }
  body.mode-draw-a .guide{ color:transparent !important; caret-color:transparent; background-image:linear-gradient(var(--l-outer) 0 2px, transparent 2px),linear-gradient(var(--l-x) 0 1.5px, transparent 1.5px),linear-gradient(var(--l-base) 0 2px, transparent 2px),linear-gradient(var(--l-outer) 0 2px, transparent 2px) !important; background-repeat:repeat-y; background-size:100% var(--band); background-position:var(--gpos); }
  body.mode-draw-a .guide:empty::before{ content:none; }
  body.mode-draw-a .guide{ background-image:none !important; top:0; }
  body.mode-draw-a .ruleClip{ background-image:linear-gradient(var(--l-outer) 0 2px, transparent 2px),linear-gradient(var(--l-x) 0 1.5px, transparent 1.5px),linear-gradient(var(--l-base) 0 2px, transparent 2px),linear-gradient(var(--l-outer) 0 2px, transparent 2px); background-repeat:repeat-y; background-size:100% var(--band); background-position:var(--gpos); }
  body.mode-draw-b #rows{ display:none; }
  body.mode-draw-b #rows:empty::before{ display:none; }

  .fab{ position:fixed; right:22px; bottom:20px; height:52px; padding:0 20px; border-radius:26px; background:var(--ink); color:#fff; font-size:15px; font-weight:700; box-shadow:0 8px 22px #1b202740; display:flex; align-items:center; gap:8px; z-index:20; }
  body.mode-draw-b .fab{ display:none; }
  .free-actions{ display:none; position:fixed; right:22px; bottom:20px; z-index:21; gap:8px; }
  body.mode-draw-b .free-actions{ display:flex; }
  .free-actions button{ height:52px; padding:0 18px; border-radius:26px; background:var(--ink); color:#fff; font-weight:750; box-shadow:0 8px 22px #1b202740; }
  .free-actions button:first-child{ background:#596473; }
  #rows:empty::before{ content:'오른쪽 아래의 + 문장 추가 버튼으로 시작하세요.'; min-height:calc(100vh - 190px); display:grid; place-items:center; color:#a3acb7; font-size:15px; font-weight:650; }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translate(-50%,16px); opacity:0; pointer-events:none; background:#1b2027; color:#fff; padding:10px 16px; border-radius:999px; font-size:13px; transition:.22s; z-index:30; }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  .copyright{ position:fixed; left:50%; bottom:10px; transform:translateX(-50%); z-index:25; padding:4px 10px; text-align:center; color:#8b95a2; font-size:12px; font-weight:650; letter-spacing:.02em; pointer-events:none; white-space:nowrap; }

  #metrics{ position:absolute; left:-9999px; top:0; visibility:hidden; white-space:nowrap; padding:0; margin:0; border:0; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* floating swatch picker for coloring a selected word/phrase in the sentence */
  .colorpop{
    position:fixed; z-index:40; transform:translate(-50%,-100%);
    display:flex; gap:6px; background:#1b2027; padding:6px; border-radius:11px;
    box-shadow:0 8px 20px #0005;
  }
  .colorpop[hidden]{ display:none; }
  .colorpop button{ width:26px; height:26px; border-radius:50%; padding:0; }
  .colorpop button span{ display:block; width:100%; height:100%; border-radius:50%; box-shadow:inset 0 0 0 1.5px #ffffff55; }
  .colorpop button:hover span{ box-shadow:inset 0 0 0 1.5px #fff; }

  @media (max-width:640px){
    .title{ width:120px; font-size:16px; }
    .stage{ padding:10px 8px 20px; }
    .sheet{ padding:10px 12px 16px; border-radius:5px; }
    .fab{ right:14px; bottom:14px; height:46px; padding:0 16px; }
    .speakBtns{ flex-basis:40px; margin-top:3px; gap:5px; }
    .speakBtn{ width:40px; height:40px; font-size:10px; }
    .rowline{ gap:8px; }
  }

  /* ---------- print ---------- */
  @media print{
    @page{ margin:14mm; }
    html,body{ height:auto; overflow:visible; background:#fff; }
    .bar,.fab,.toast,.rowtools,.speakBtns,.colorpop{ display:none !important; }
    .rowline{ display:block; }
    .stage{ height:auto; overflow:visible; padding:0; }
    .sheet{ box-shadow:none; border:0; border-radius:0; padding:0; min-height:0; }
    .row{ break-inside:avoid; page-break-inside:avoid; }
    .row + .row{ border-top:0; }
    body:not(.print-ink) #ink{ display:none; }
    .guide:empty::before, .ko:empty::before{ content:none; }
    .copyright{ position:static; transform:none; padding-top:8mm; }
  }
</style>
</head>
<body class="mode-edit">

<header class="bar">
  <input class="title" id="title" aria-label="학습지 제목" placeholder="JAEYUN MADE" />

  <div class="grp">
    <div class="seg" role="group" aria-label="모드">
      <button id="mEdit"  aria-pressed="true">✏️ 편집</button>
      <button id="mDrawA" aria-pressed="false">🖊️ 필기(A)</button>
      <button id="mDrawB" aria-pressed="false">🖍️ 필기(B)</button>
    </div>
  </div>

  <div class="grp" id="drawTools" hidden>
    <button class="btn" id="tPen"   aria-pressed="true"  title="펜">✒️</button>
    <button class="btn" id="tErase" aria-pressed="false" title="지우개">🧽</button>
    <span class="lbl">색</span>
    <button class="swatch" data-color="#1b2027" aria-pressed="true"  aria-label="검정"><span style="background:#1b2027"></span></button>
    <button class="swatch" data-color="#e0322b" aria-pressed="false" aria-label="빨강"><span style="background:#e0322b"></span></button>
    <button class="swatch" data-color="#1f6fd0" aria-pressed="false" aria-label="파랑"><span style="background:#1f6fd0"></span></button>
    <button class="swatch" data-color="#1f9457" aria-pressed="false" aria-label="초록"><span style="background:#1f9457"></span></button>
    <span class="lbl">굵기</span>
    <button class="nib" data-w="4"  aria-pressed="false" aria-label="가늘게"><i style="width:5px;height:5px"></i></button>
    <button class="nib" data-w="9"  aria-pressed="true"  aria-label="보통"><i style="width:10px;height:10px"></i></button>
    <button class="nib" data-w="18" aria-pressed="false" aria-label="굵게"><i style="width:16px;height:16px"></i></button>
    <button class="btn" id="undo" title="되돌리기" aria-label="필기 되돌리기" disabled>↩︎</button>
    <button class="btn" id="clearInk" title="필기 전체 지우기" aria-label="필기 전체 지우기">전체 지우기</button>
  </div>

  <div class="grp" id="editTools">
    <span class="lbl">표시 줄 수</span>
    <div class="seg" role="group" id="lineCount" aria-label="한 화면에 보일 문장 수"></div>
    <span class="lbl">문장 크기</span>
    <input class="rng" id="scale" type="range" min="50" max="160" step="5" value="100" aria-label="영어 문장 크기 확대·축소" />
    <span class="lbl">예시 농도</span>
    <input class="rng" id="dimAll" type="range" min="0" max="100" step="5" value="100" aria-label="모든 문장 예시 농도" />
  </div>

  <div class="grp end">
    <select class="sel" id="orient" aria-label="인쇄 용지 방향">
      <option value="portrait">A4 세로</option>
      <option value="landscape">A4 가로</option>
    </select>
    <button class="btn ghost" id="print" title="인쇄" aria-label="인쇄">🖨</button>
    <button class="btn ghost" id="full" title="전체 화면" aria-label="전체 화면">⛶</button>
    <span class="dot" id="dot" role="status" aria-label="저장 상태"></span>
  </div>
</header>

<main class="stage" id="stage">
  <div class="sheet" id="sheet">
    <div id="rows"></div>
    <footer class="copyright">© 2026 박재윤. All rights reserved.</footer>
    <canvas id="ink" aria-label="필기 판서 영역"></canvas>
  </div>
</main>

<button class="fab" id="addRow">＋ 문장 추가</button>
<div class="free-actions" aria-label="화이트보드 필기 도구">
  <button id="freeUndo">↩ 되돌리기</button>
  <button id="freeClear">전체 지우기</button>
</div>
<div class="colorpop" id="colorpop" hidden role="group" aria-label="선택한 글자 색">
  <button type="button" data-c="#1b2027" aria-label="기본 색(검정)"><span style="background:#1b2027"></span></button>
  <button type="button" data-c="#e0322b" aria-label="빨강"><span style="background:#e0322b"></span></button>
  <button type="button" data-c="#1f6fd0" aria-label="파랑"><span style="background:#1f6fd0"></span></button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="metrics" aria-hidden="true"></div>
<style id="pageRule">@page{ size:A4 portrait; }</style>

<script>
'use strict';
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const clamp = (lo, v, hi) => Math.min(hi, Math.max(lo, v));

/* ================= inline-color sanitizing =================
   English sentences are stored as HTML so a teacher can color a word or two,
   but the only thing ever allowed through is <span style="color:ONE-OF-4">.
   Everything else — scripts, images, links, other tags/attributes — is
   unwrapped (text kept, wrapper dropped) or stripped outright. Typing never
   goes through this path (typed characters are always plain text nodes);
   paste is forced to plain text separately, so HTML only ever enters here
   via our own color-button clicks or a legacy-data migration, both of which
   only ever produce these exact whitelisted spans. */
const INK_COLORS = new Set(['#1b2027', '#e0322b', '#1f6fd0']);
function normalizeColorValue(v){
  if(!v) return null;
  v = String(v).trim().toLowerCase();
  const m = v.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
  if(m) v = '#' + [1,2,3].map(i => (+m[i]).toString(16).padStart(2,'0')).join('');
  return INK_COLORS.has(v) ? v : null;
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function sanitizeInline(html){
  const root = document.createElement('div');
  root.innerHTML = String(html == null ? '' : html);
  (function clean(node){
    Array.from(node.childNodes).forEach(child => {
      if(child.nodeType === Node.TEXT_NODE) return;
      if(child.nodeType !== Node.ELEMENT_NODE){ child.remove(); return; }
      clean(child);
      const tag = child.tagName;
      let color = null;
      if(tag === 'SPAN') color = normalizeColorValue(child.style && child.style.color);
      else if(tag === 'FONT') color = normalizeColorValue(child.getAttribute('color')) || normalizeColorValue(child.style && child.style.color);
      if(color){
        const span = document.createElement('span');
        span.style.color = color;
        while(child.firstChild) span.appendChild(child.firstChild);
        child.replaceWith(span);
      }else{
        while(child.firstChild) node.insertBefore(child.firstChild, child);
        child.remove();
      }
    });
  })(root);
  return root.innerHTML;
}
function plainTextOf(html){
  const root = document.createElement('div');
  root.innerHTML = sanitizeInline(html);
  return root.textContent;
}

/* ================= state ================= */
const STORE = 'ehw.v6';
const LEGACY_STORE = 'ehw.v5';
const DEFAULTS = () => ({
  title: 'JAEYUN MADE',
  lines: 1,
  scale: 100,
  editRows: [],
  drawARows: []
});

let state = load();
if(!state.title || state.title === '오늘의 문장') state.title = 'JAEYUN MADE';

function load(){
  try{
    let raw = localStorage.getItem(STORE);
    let legacy = false;
    if(!raw && LEGACY_STORE){
      // v2 stored `en` as plain text; escape it before treating it as HTML so
      // nothing already saved by a teacher is lost or misparsed by the switch
      // to rich (colorable) sentences.
      raw = localStorage.getItem(LEGACY_STORE);
      legacy = !!raw;
    }
    if(!raw) return DEFAULTS();
    const p = JSON.parse(raw);
    if(!p) return DEFAULTS();
    const normalizeRows = rows => Array.isArray(rows) ? rows.map(r => ({
      en: legacy ? escapeHtml(r && r.en || '') : sanitizeInline(r && r.en || ''),
      ko: String(r && r.ko || ''),
      dim: clamp(0, Number(r && r.dim), 100) || (r && r.dim === 0 ? 0 : 100)
    })) : [];
    // Earlier versions had one shared sentence list. Keep it in 편집 only;
    // 필기(A) deliberately begins empty and remains an independent workspace.
    const editRows = normalizeRows(Array.isArray(p.editRows) ? p.editRows : p.rows);
    const drawARows = normalizeRows(p.drawARows);
    return {
      title: typeof p.title === 'string' ? p.title : '오늘의 문장',
      lines: clamp(1, Number(p.lines) || 1, 3),
      scale: clamp(50, Number(p.scale) || 100, 160),
      editRows,
      drawARows
    };
  }catch(e){ return DEFAULTS(); }
}

/* ================= font metrics ================= */
/* Measure the real ink extents of the practice face so the four rules can be
   derived from the font instead of hard-coded percentages. */
const FONT = 'Andika, Georgia, "Times New Roman", serif';
let FM = null;   // { a, x, d, cap }  — normalised to font-size 1

function measureFont(){
  const P = 200;
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = `400 ${P}px ${FONT}`;
  const asc = s => ctx.measureText(s).actualBoundingBoxAscent;
  const dsc = s => ctx.measureText(s).actualBoundingBoxDescent;
  const cap = asc('H');
  // The top rule is the CAPITAL line — that is how 4선 is taught here, so an
  // uppercase letter fills the top zone exactly. Andika's ascenders run ~11%
  // taller than its capitals and therefore rise past it; the gap between
  // blocks is sized below to swallow that instead of letting them collide.
  const ascender = Math.max(cap, asc('bdfhklt'));
  // flat-topped letters only. Round tops (a c e o s) and arch shoulders (n m r)
  // overshoot x-height by ~1.5% by design, so they must not set the rule.
  const x = asc('xzvwu');
  const d = Math.max(dsc('gjpqy'), P * 0.12);   // guard against fonts reporting ~0
  FM = { cap:cap/P, ascender:ascender/P, x:x/P, d:d/P };
}

/* Where the baseline actually falls inside a line box of the given metrics.
   A zero-height inline-block sits with its bottom edge on the baseline. */
function baselineInLineBox(fontPx, linePx){
  const m = $('#metrics');
  m.style.font = `400 ${fontPx}px/${linePx}px ${FONT}`;
  m.textContent = '';
  const probe = document.createElement('span');
  probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
  m.appendChild(probe);
  m.appendChild(document.createTextNode('Hxy'));
  const off = probe.getBoundingClientRect().top - m.getBoundingClientRect().top;
  m.textContent = '';
  return off;
}

/* ================= layout ================= */
const root = document.documentElement;
let GEO = { band:120, blockH:104, F:64, L2:40, L3:80, winH:140, shift:0 };

const measureCtx = document.createElement('canvas').getContext('2d');
function widthAtSize1(text){
  measureCtx.font = `400 100px ${FONT}`;
  return measureCtx.measureText(text || '').width / 100;
}

/* Font size: fit the longest sentence on ONE line at the available width, like
   a notebook where every ruled line is the same size regardless of how many
   sentences are on the page. Line count no longer shrinks it — only the size
   slider and this width fit do. Capped so a short sentence doesn't balloon,
   floored so a long one stays legible. */
function fitFont(availW, printing){
  const W1 = Math.max(0.05, ...activeRows().map(r => widthAtSize1(plainTextOf(r.en) || 'Type a sentence…')));
  const ceiling = printing ? 110 : 240;
  const floor   = printing ? 32 : Math.max(26, 70 - (state.lines - 1) * 11);
  // Prefer one line at a legible size. Only a genuinely long sentence should
  // ever hit the floor — and when it does, let it wrap to two lines instead
  // of shrinking every row (including short ones, since F is shared) down to
  // an unreadable size just to keep that one sentence on a single line.
  let fitted = clamp(floor, availW / W1, ceiling);
  if(fitted <= floor + 0.5) fitted = clamp(floor, (2 * availW) / W1, ceiling);
  // scale multiplies the fitted size afterward, so it still has an effect
  // even when the width fit (not the ceiling) is what's binding
  const s = clamp(50, Number(state.scale) || 100, 160) / 100;
  return fitted * s;
}

/* Andika's own metrics make the browser's line-height half-leading push the
   real baseline much lower than our ink-based cap line calls for. Chasing
   that with a bigger line-height only pushes it lower still (each px of
   line-height splits ~50/50 above/below the baseline), so the tile height
   that finally satisfies "descender rule fits above the tile's bottom edge"
   works out to roughly 1.3× the block itself — a wide gap with no way to
   trim it from inside CSS's own centering model. Find that tile size (TILE,
   O_natural) for internal use only; it is never shown directly. */
function resolveRuling(F, blockH, startBand){
  let band = startBand;
  for(let i = 0; i < 6; i++){
    const bo = baselineInLineBox(F, band);
    const L3 = FM.cap * F;
    const O  = ((bo - L3) % band + band) % band;
    if(O + blockH - 2 <= band - 0.5) return { band, O };
    band = O + blockH - 2 + 6;
  }
  const bo = baselineInLineBox(F, band);
  const L3 = FM.cap * F;
  return { band, O:((bo - L3) % band + band) % band };
}

function layout(opts){
  if(!FM) return;
  const printing = !!(opts && opts.print);
  const probe = $('.guide');
  const availW = (probe ? probe.clientWidth : $('#sheet').clientWidth - 52) * 0.97;

  const stageH = $('#stage').clientHeight;
  const perRow = printing ? Infinity : Math.max(108, (stageH - 38) / state.lines);
  const ko = $('.ko');
  const koH = ko ? Math.max(38, ko.getBoundingClientRect().height + 10) : 58;
  const chromeH = koH + 38;
  const metricRatio = FM.cap + FM.d + 0.14;
  const heightFit = printing ? Infinity : Math.max(24, (perRow - chromeH) / metricRatio);
  const F = Math.min(fitFont(availW, printing), heightFit);

  // Preserve the established four-line teaching geometry: the capital line,
  // dashed middle, blue baseline and descender line form three equal zones.
  // The font is fitted into this ruling; the ruling is never derived from a
  // single glyph's x-height or descender shape.
  const cap = FM.cap * F, ascender = FM.ascender * F;
  // Move the dashed second rule slightly upward so the x-height-to-baseline
  // zone (rules 2→3) has a little more breathing room for the practice face.
  const half = cap / 2, L2 = cap * 0.40, L3 = cap, blockH = cap + half;
  const nominalGap = Math.max(0.12 * blockH, (ascender - cap) + 0.05 * F);
  const { band:TILE, O:O_natural } = resolveRuling(F, blockH, blockH + nominalGap);
  const O_target = Math.max((ascender - cap) * 1.3, 0.10 * blockH);
  const shift = Math.max(0, O_natural - O_target);

  const p = n => `0 ${n.toFixed(2)}px`;
  root.style.setProperty('--F', F.toFixed(2) + 'px');
  root.style.setProperty('--band', TILE.toFixed(2) + 'px');
  root.style.setProperty('--gpos',
    [ p(O_natural), p(O_natural + L2), p(O_natural + L3), p(O_natural + blockH - 2) ].join(', '));
  root.style.setProperty('--shift', (-shift).toFixed(2) + 'px');
  root.style.setProperty('--page-row-height', printing ? 'auto' : perRow.toFixed(2) + 'px');

  GEO = { F, band:TILE, blockH, L2, L3, O:O_natural, O_target, shift, winH:O_target + blockH + 4 };

  // Per-row window height: most sentences are one line (O_target + blockH),
  // but a rare long one that still wraps needs room for its extra lines too —
  // measured after the shared CSS vars above have taken effect.
  $$('.guide').forEach(g => {
    const lines = Math.max(1, Math.round(g.scrollHeight / TILE));
    const h = GEO.O_target + (lines - 1) * TILE + blockH + 4;
    const clip = g.closest('.ruleClip');
    if(clip) clip.style.height = h.toFixed(1) + 'px';
  });

  sizeCanvas();
}

/* Typing a longer sentence than what's there can require a smaller F to keep
   it on one line — debounced so it doesn't refit on every keystroke. */
let layoutTimer = null;
function layoutSoon(){
  clearTimeout(layoutTimer);
  layoutTimer = setTimeout(() => layout(), 180);
}

/* ================= rows ================= */
const rowsEl = $('#rows');

function applyDim(row, i){
  const el = row.querySelector('.guide');
  const v  = activeRows()[i].dim;
  const eff = (document.activeElement === el) ? Math.max(v, 35) : v;
  el.style.color = `rgba(17, 20, 26, ${eff / 100})`;
}

function makeRow(item, i){
  const row = document.createElement('div');
  row.className = 'row';

  const en = document.createElement('div');
  en.className = 'guide';
  en.lang = 'en';
  en.spellcheck = false;
  en.setAttribute('role', 'textbox');
  en.setAttribute('aria-label', `영어 문장 ${i + 1}. 일부를 드래그해 선택하면 색을 바꿀 수 있어요.`);
  en.dataset.ph = 'Type a sentence…';
  setEditableRich(en);
  en.innerHTML = sanitizeInline(item.en);   // never raw innerHTML — always through the sanitizer

  const ko = document.createElement('div');
  ko.className = 'ko';
  ko.lang = 'ko';
  ko.spellcheck = false;               // browsers otherwise red-underline Korean as "misspelled"
  ko.setAttribute('autocorrect', 'off');
  ko.setAttribute('autocapitalize', 'off');
  ko.setAttribute('autocomplete', 'off');
  ko.setAttribute('data-gramm', 'false');   // also mute the Grammarly extension's red marks
  ko.setAttribute('role', 'textbox');
  ko.setAttribute('aria-label', `한글 뜻 ${i + 1}`);
  ko.dataset.ph = '한글 뜻을 입력하세요';
  setEditablePlain(ko);
  ko.textContent = item.ko;

  const tools = document.createElement('div');
  tools.className = 'rowtools';

  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = String(i + 1).padStart(2, '0');

  const dim = document.createElement('input');
  dim.type = 'range'; dim.className = 'rng';
  dim.min = 0; dim.max = 100; dim.step = 5; dim.value = item.dim;
  dim.title = '예시 농도 (0 숨김 · 30 회색 · 100 검정)';
  dim.setAttribute('aria-label', `문장 ${i + 1} 예시 농도`);

  const del = mkBtn('✕', `문장 ${i + 1} 삭제`);
  tools.append(num, dim, del);

  const speakBtns = document.createElement('div');
  speakBtns.className = 'speakBtns';
  speakBtns.setAttribute('aria-label', `문장 ${i + 1} 영어 발음 선택`);

  const speakUS = mkBtn('U.S', `문장 ${i + 1} 미국 영어로 읽기`);
  speakUS.className = 'speakBtn';
  speakUS.dataset.voice = 'en-US';
  const speakUK = mkBtn('U.K', `문장 ${i + 1} 영국 영어로 읽기`);
  speakUK.className = 'speakBtn';
  speakUK.dataset.voice = 'en-GB';
  speakBtns.append(speakUS, speakUK);

  const ruleClip = document.createElement('div');
  ruleClip.className = 'ruleClip';
  ruleClip.appendChild(en);

  const body = document.createElement('div');
  body.className = 'rowbody';
  body.append(ruleClip, ko);

  const line = document.createElement('div');
  line.className = 'rowline';
  line.append(speakBtns, body);

  row.append(tools, line);

  /* --- behaviour --- */
  en.addEventListener('input', () => { activeRows()[i].en = sanitizeInline(en.innerHTML); save(); layoutSoon(); });
  en.addEventListener('keydown', e => { if(e.key === 'Enter') e.preventDefault(); });   // sentences don't wrap via manual newlines
  ko.addEventListener('input', () => { activeRows()[i].ko = ko.textContent; save(); });
  en.addEventListener('focus', () => applyDim(row, i));
  en.addEventListener('blur',  () => applyDim(row, i));
  [en, ko].forEach(el => el.addEventListener('paste', onPastePlain));   // colors only ever come from our own swatch buttons, never pasted HTML
  ruleClip.addEventListener('pointerdown', e => {
    if(!document.body.classList.contains('mode-draw-a')) return;
    beginStroke(e);
  });
  ruleClip.addEventListener('pointermove', moveStroke);
  ruleClip.addEventListener('pointerup', endStroke);
  ruleClip.addEventListener('pointercancel', endStroke);

  dim.addEventListener('input', () => {
    const v = Number(dim.value);
    activeRows()[i].dim = v;
    // snap to the three meaningful stops so the teacher can hit them reliably
    if(v > 0 && v < 15) dim.value = activeRows()[i].dim = 0;
    else if(v >= 25 && v <= 35) dim.value = activeRows()[i].dim = 30;
    else if(v > 92) dim.value = activeRows()[i].dim = 100;
    applyDim(row, i); save();
  });

  speakUS.onclick = () => speakText(plainTextOf(activeRows()[i].en), speakUS, 'en-US');
  speakUK.onclick = () => speakText(plainTextOf(activeRows()[i].en), speakUK, 'en-GB');
  del.onclick = () => {
    activeRows().splice(i, 1); render(); save(); notify('문장을 삭제했어요.');
  };

  applyDim(row, i);
  return row;
}

function mkBtn(glyph, label){
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = glyph;
  b.title = label; b.setAttribute('aria-label', label);
  return b;
}

/* .guide allows inline <span style="color:…"> from the color-swatch popup.
   .ko stays plain — no formatting needed for the Korean gloss. */
function setEditableRich(el){
  el.setAttribute('contenteditable', 'true');
}
function setEditablePlain(el){
  el.setAttribute('contenteditable', 'plaintext-only');
  // Firefox < 136 rejects plaintext-only and reports "inherit"
  if(el.contentEditable !== 'plaintext-only') el.setAttribute('contenteditable', 'true');
}

function onPastePlain(e){
  const txt = (e.clipboardData || window.clipboardData).getData('text/plain');
  e.preventDefault();
  document.execCommand('insertText', false, txt.replace(/\s*\n\s*/g, ' '));
}

function render(){
  rowsEl.textContent = '';
  activeRows().forEach((r, i) => rowsEl.appendChild(makeRow(r, i)));
  applySnapGrouping();
  layout();
}

function activeRows(){
  return currentMode === 'drawA' ? state.drawARows : state.editRows;
}

/* 표시 줄 수 no longer resizes anything (a fixed English size looks better —
   like ruled notebook paper, not a screen-filling budget), so its remaining
   job is purely how scrolling pages through the sheet: N=1 snaps to every
   sentence, N=3 snaps every three, etc. */
function applySnapGrouping(){
  const n = clamp(1, Number(state.lines) || 1, 3);
  $$('.row').forEach((row, i) => row.classList.toggle('snapPoint', i % n === 0));
}

/* ================= speech (secondary feature) ================= */
const SPEECH_RATE = 0.8;
function speakText(text, btn, lang = 'en-US'){
  if(!text.trim()) return notify('읽을 문장을 먼저 입력하세요.');
  if(!('speechSynthesis' in window)) return notify('이 브라우저는 음성을 지원하지 않아요.');
  speechSynthesis.cancel();
  $$('.speakBtn.speaking').forEach(b => b.classList.remove('speaking'));   // only one plays at a time
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = SPEECH_RATE;
  if(btn){
    btn.classList.add('speaking');
    u.onend = u.onerror = () => btn.classList.remove('speaking');
  }
  speechSynthesis.speak(u);
  window.__app && (window.__app.lastRate = SPEECH_RATE);
}

/* ================= ink ================= */
const canvas = $('#ink');
const cx = canvas.getContext('2d');
const inkStores = { drawA:[], drawB:[] };
const inkHistories = { drawA:[], drawB:[] };
let currentInkMode = 'drawA';
let strokes = inkStores.drawA;       // active mode's document-coordinate strokes
let history = inkHistories.drawA;    // active mode's undo snapshots
let cur = null;
let inkCaptureTarget = null;
let activeInkBounds = null;
let tool = 'pen', penColor = '#1b2027', penW = 9;

function sizeCanvas(){
  const sheet = $('#sheet');
  const w = sheet.offsetWidth, h = sheet.offsetHeight;
  if(!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}

function redraw(){
  cx.clearRect(0, 0, canvas.width, canvas.height);
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  for(const s of strokes) drawStroke(s);
}

function drawStroke(s){
  const p = s.pts;
  cx.strokeStyle = s.color; cx.lineWidth = s.w;
  cx.beginPath();
  if(p.length === 1){
    cx.arc(p[0].x, p[0].y, s.w / 2, 0, Math.PI * 2);
    cx.fillStyle = s.color; cx.fill();
    return;
  }
  cx.moveTo(p[0].x, p[0].y);
  for(let i = 1; i < p.length - 1; i++){
    const m = { x:(p[i].x + p[i+1].x) / 2, y:(p[i].y + p[i+1].y) / 2 };
    cx.quadraticCurveTo(p[i].x, p[i].y, m.x, m.y);   // midpoint smoothing
  }
  cx.lineTo(p[p.length-1].x, p[p.length-1].y);
  cx.stroke();
}

function ptOf(e){
  const r = canvas.getBoundingClientRect();
  return { x:e.clientX - r.left, y:e.clientY - r.top };
}

function pushHistory(){
  history.push(strokes.map(s => ({ color:s.color, w:s.w, pts:s.pts })));
  if(history.length > 60) history.shift();
  $('#undo').disabled = false;
}

function eraseAt(p){
  const R = 22;
  const before = strokes.length;
  strokes = strokes.filter(s => !s.pts.some(q => Math.hypot(q.x - p.x, q.y - p.y) < R + s.w / 2));
  inkStores[currentInkMode] = strokes;
  if(strokes.length !== before) redraw();
  return strokes.length !== before;
}

function beginStroke(e){
  e.preventDefault();
  inkCaptureTarget = e.currentTarget;
  inkCaptureTarget.setPointerCapture?.(e.pointerId);
  if(document.body.classList.contains('mode-draw-a')){
    const a=inkCaptureTarget.getBoundingClientRect(), c=canvas.getBoundingClientRect();
    activeInkBounds={ left:a.left-c.left, top:a.top-c.top, right:a.right-c.left, bottom:a.bottom-c.top };
  }else activeInkBounds=null;
  const p = ptOf(e);
  if(tool === 'erase'){ pushHistory(); eraseAt(p); cur = { erasing:true }; return; }
  pushHistory();
  cur = { color:penColor, w:penW, pts:[p] };
  strokes.push(cur);
  drawStroke(cur);
}

function moveStroke(e){
  if(!cur) return;
  e.preventDefault();
  const inside = p => !activeInkBounds || (p.x>=activeInkBounds.left && p.x<=activeInkBounds.right && p.y>=activeInkBounds.top && p.y<=activeInkBounds.bottom);
  if(cur.erasing){ const p=ptOf(e); if(inside(p)) eraseAt(p); return; }
  const evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for(const ev of evts){ const p=ptOf(ev); if(inside(p)) cur.pts.push(p); }
  redraw();
}

function endStroke(e){
  if(!cur) return;
  if(e && inkCaptureTarget?.hasPointerCapture?.(e.pointerId)) inkCaptureTarget.releasePointerCapture(e.pointerId);
  cur = null;
  inkCaptureTarget = null;
  activeInkBounds = null;
}
canvas.addEventListener('pointerdown', e => {
  if(!document.body.classList.contains('mode-draw-b')) return;
  beginStroke(e);
});
canvas.addEventListener('pointermove', moveStroke);
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);   // note: NOT pointerleave

$('#undo').onclick = () => {
  if(!history.length) return;
  strokes = history.pop();
  inkStores[currentInkMode] = strokes;
  $('#undo').disabled = !history.length;
  redraw();
};
$('#clearInk').onclick = () => {
  if(!strokes.length) return notify('지울 필기가 없어요.');
  pushHistory(); strokes = []; inkStores[currentInkMode] = strokes; redraw(); notify('필기를 모두 지웠어요.');
};
$('#freeUndo').onclick = () => $('#undo').click();
$('#freeClear').onclick = () => $('#clearInk').click();

/* ================= toolbar wiring ================= */

/* 표시 줄 수 — fits N complete rows in the visible stage and keeps page snaps */
const lc = $('#lineCount');
for(let n = 1; n <= 3; n++){
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = String(n);
  b.setAttribute('aria-label', `화면에 ${n}문장 표시`);
  b.setAttribute('aria-pressed', String(n === state.lines));
  b.onclick = () => {

    applySnapGrouping();

    $('#stage').scrollTo({ top:0, behavior:'smooth' });
    save();
  };
  lc.appendChild(b);
}

$('#scale').value = state.scale;
$('#scale').oninput = e => {
  state.scale = Number(e.target.value);
  layout(); save();
};

/* ================= inline color popup ================= */
const colorpop = $('#colorpop');
let colorTarget = null;

document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed || document.body.classList.contains('mode-draw')){
    colorpop.hidden = true; colorTarget = null; return;
  }
  const anchorEl = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  const guideEl = anchorEl && anchorEl.closest && anchorEl.closest('.guide');
  if(!guideEl){ colorpop.hidden = true; colorTarget = null; return; }
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  if(!rect || (rect.width === 0 && rect.height === 0)){ colorpop.hidden = true; return; }
  colorTarget = guideEl;
  colorpop.style.left = clamp(40, rect.left + rect.width / 2, innerWidth - 40) + 'px';
  colorpop.style.top  = Math.max(44, rect.top - 8) + 'px';
  colorpop.hidden = false;
});

/* execCommand('foreColor') is deprecated and already unreliable in current
   Chromium (silently returns false), so the selected range is recolored by
   hand: lift it out, wrap it in a plain <span style="color:…">, put it back. */
function colorSelection(color){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed) return false;
  const range = sel.getRangeAt(0);
  const span = document.createElement('span');
  span.style.color = color;
  span.appendChild(range.extractContents());
  range.insertNode(span);
  sel.removeAllRanges();
  const after = document.createRange();
  after.selectNodeContents(span);
  sel.addRange(after);
  return true;
}

$$('button', colorpop).forEach(btn => {
  btn.addEventListener('mousedown', e => e.preventDefault());   // keep the text selection alive through the click
  btn.addEventListener('click', () => {
    if(!colorTarget) return;
    colorSelection(btn.dataset.c);
    const i = $$('.guide').indexOf(colorTarget);
    if(i >= 0){ activeRows()[i].en = sanitizeInline(colorTarget.innerHTML); save(); }
    colorpop.hidden = true;
  });
});

$('#dimAll').oninput = e => {
  const v = Number(e.target.value);
  activeRows().forEach(r => r.dim = v);
  $$('.rowtools .rng').forEach(r => r.value = v);
  $$('.row').forEach((row, i) => applyDim(row, i));
  save();
};

$('#addRow').onclick = () => {
  activeRows().push({ en:'', ko:'', dim:100 });
  render(); save();
  const last = $$('.guide').pop();
  if(last){
    if(document.body.classList.contains('mode-edit')) last.focus();
    last.closest('.row').scrollIntoView({ behavior:'smooth', block:'center' });
  }
};

$('#title').value = state.title;
$('#title').addEventListener('input', e => { state.title = e.target.value; save(); });

$('#orient').onchange = e => {
  $('#pageRule').textContent = `@page{ size:A4 ${e.target.value}; }`;
};

$('#print').onclick = () => window.print();
$('#full').onclick = () => {
  if(document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => notify('전체 화면을 사용할 수 없어요.'));
};

window.addEventListener('beforeprint', () => layout({ print:true }));
window.addEventListener('afterprint',  () => layout());

/* keep geometry in sync with the viewport / rotation */
let roTimer = null;
new ResizeObserver(() => { clearTimeout(roTimer); roTimer = setTimeout(() => layout(), 60); })
  .observe($('#stage'));

/* ================= boot ================= */
async function boot(){
  try{
    await Promise.all([
      document.fonts.load(`400 200px Andika`),
      document.fonts.load(`700 200px Andika`)
    ]);
    await document.fonts.ready;
  }catch(e){ /* fall back to the serif stack */ }
  measureFont();
  render();
  // second pass: the sheet height is only final once rows exist
  requestAnimationFrame(() => { layout(); sizeCanvas(); });
}
boot();

/* Offline support. Guarded on protocol because registering from file:// throws,
   and teachers do open the file directly when testing. */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

/* exposed for the verification harness */
window.__app = {
  get state(){ return state; },
  get geo(){ return GEO; },
  get fm(){ return FM; },
  get strokes(){ return strokes; },
  lastRate: null,
  sanitizeInline, plainTextOf
};
</script>
