<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#eef1f5" />
<title>영어 4선 칠판</title>
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="4선 칠판" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fff'/%3E%3Cg stroke='%238f9bab' stroke-width='1.6'%3E%3Cpath d='M3 7h26M3 25h26'/%3E%3C/g%3E%3Cpath d='M3 13h26' stroke='%23b6c3d2' stroke-width='1.2'/%3E%3Cpath d='M3 19h26' stroke='%234a9fd8' stroke-width='1.6'/%3E%3Ctext x='16' y='19' font-family='Georgia,serif' font-size='15' text-anchor='middle' fill='%231b2027'%3EAa%3C/text%3E%3C/svg%3E" />
<style>
  @font-face { font-family:Andika; src:url('./fonts/Andika-Regular.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face { font-family:Andika; src:url('./fonts/Andika-Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }

  :root{
    --bg:#eef1f5; --paper:#fff; --ink:#1b2027; --muted:#79838f; --hair:#e3e8ee;
    --accent:#eb6536; --accent-soft:#fff1ea;
    --l-outer:#8f9bab; --l-x:#b6c3d2; --l-base:#4a9fd8;
    --F:64px; --band:120px; --ko:22px; --gpos:0 0; --rowH:220px;
    --pen:#1b2027;
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }   /* .grp{display:flex} would otherwise win */
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  button,input,select{ font:inherit; color:inherit; }
  button{ cursor:pointer; border:0; background:none; }

  /* ---------- toolbar ---------- */
  .bar{
    height:60px; background:var(--paper); border-bottom:1px solid var(--hair);
    display:flex; align-items:center; gap:14px; padding:0 16px;
    overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; white-space:nowrap;
  }
  .grp{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .grp + .grp{ border-left:1px solid var(--hair); padding-left:14px; }
  .grp.end{ margin-left:auto; border-left:0; padding-left:0; }
  .lbl{ color:var(--muted); font-size:12px; font-weight:700; flex:0 0 auto; }
  .title{ border:0; outline:0; background:transparent; font-size:19px; font-weight:800; letter-spacing:-.03em; width:190px; min-width:120px; }
  .title::placeholder{ color:#b7bfc9; }

  .btn{ height:38px; min-width:38px; padding:0 12px; border-radius:10px; background:#f2f5f8; color:#4b5563; font-size:14px; font-weight:650; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn:hover{ background:#e6ecf2; }
  .btn[aria-pressed="true"], .btn.on{ background:var(--accent); color:#fff; }
  .btn.ghost{ background:transparent; }
  .btn:disabled{ opacity:.38; cursor:default; }

  .seg{ display:flex; background:#f2f5f8; border-radius:11px; padding:3px; gap:2px; }
  .seg button{ height:32px; padding:0 13px; border-radius:8px; font-size:14px; font-weight:700; color:#5b6673; }
  .seg button[aria-pressed="true"]{ background:var(--paper); color:var(--accent); box-shadow:0 1px 3px #0000001f; }

  .swatch{ width:28px; height:28px; border-radius:50%; border:2px solid transparent; padding:0; }
  .swatch span{ display:block; width:100%; height:100%; border-radius:50%; box-shadow:inset 0 0 0 1px #00000018; }
  .swatch[aria-pressed="true"]{ border-color:var(--accent); }
  .nib{ width:34px; height:34px; border-radius:9px; background:#f2f5f8; display:grid; place-items:center; }
  .nib i{ display:block; background:#4b5563; border-radius:50%; }
  .nib[aria-pressed="true"]{ background:var(--accent); } .nib[aria-pressed="true"] i{ background:#fff; }

  .rng{ width:96px; accent-color:var(--accent); }
  .sel{ height:38px; border:1px solid #dbe2e9; background:var(--paper); border-radius:10px; padding:0 9px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#3fae7c; transition:.25s; }
  .dot.pending{ background:#e0b23c; }

  /* ---------- stage ---------- */
  .stage{ height:calc(100% - 60px); overflow:auto; overscroll-behavior:contain; padding:18px 20px 26px; }
  body.snap .stage{ scroll-snap-type:y proximity; }
  .sheet{ position:relative; background:var(--paper); border:1px solid var(--hair); border-radius:8px; box-shadow:0 10px 30px #1b20270d; padding:14px 26px 20px; min-height:100%; }

  .row{ position:relative; min-height:var(--rowH); display:flex; flex-direction:column; justify-content:center; }
  body.snap .row{ scroll-snap-align:center; }
  .row + .row{ border-top:1px dashed #eaeef3; }

  .guide{
    font-family:Andika,Georgia,"Times New Roman",serif; font-weight:400;
    font-size:var(--F); line-height:var(--band);
    outline:0; padding:0 .12em; margin:0;
    background-image:
      linear-gradient(var(--l-outer) 0 2px, transparent 2px),
      linear-gradient(var(--l-x)     0 1.5px, transparent 1.5px),
      linear-gradient(var(--l-base)  0 2px, transparent 2px),
      linear-gradient(var(--l-outer) 0 2px, transparent 2px);
    background-repeat:repeat-y;
    background-size:100% var(--band);
    background-position:var(--gpos);
    background-origin:border-box;
    caret-color:var(--accent);
    word-break:break-word;
    -webkit-user-modify:read-write-plaintext-only;
  }
  .guide:empty::before{ content:attr(data-ph); color:#c3cbd5; }

  .ko{
    font-size:var(--ko); line-height:1.35; color:#55606d; font-weight:500;
    outline:0; margin:6px 0 0; padding:2px 4px; border-radius:6px; min-height:1.35em;
    word-break:break-word;
  }
  .ko:empty::before{ content:attr(data-ph); color:#c3cbd5; }
  .ko:focus{ background:#f6f8fb; }

  .rowtools{
    position:absolute; top:4px; right:4px; z-index:6;
    display:flex; align-items:center; gap:6px;
    background:#ffffffec; border:1px solid var(--hair); border-radius:11px;
    padding:5px 8px; box-shadow:0 2px 8px #1b20270f;
  }
  body.mode-draw .rowtools{ display:none; }
  .rowtools .num{ color:#aab3be; font-size:11px; font-weight:800; min-width:16px; }
  .rowtools .rng{ width:74px; }
  .rowtools button{ width:28px; height:28px; border-radius:8px; color:#65707d; font-size:14px; }
  .rowtools button:hover{ background:var(--accent-soft); color:var(--accent); }

  /* ---------- ink ---------- */
  #ink{ position:absolute; inset:0; z-index:4; touch-action:none; pointer-events:none; }
  body.mode-draw #ink{ pointer-events:auto; cursor:crosshair; }
  body.mode-draw .guide, body.mode-draw .ko{ -webkit-user-modify:read-only; user-select:none; }
  body.mode-draw .stage{ overscroll-behavior:none; }

  .fab{ position:fixed; right:22px; bottom:20px; height:52px; padding:0 20px; border-radius:26px; background:var(--ink); color:#fff; font-size:15px; font-weight:700; box-shadow:0 8px 22px #1b202740; display:flex; align-items:center; gap:8px; z-index:20; }
  body.mode-draw .fab{ display:none; }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translate(-50%,16px); opacity:0; pointer-events:none; background:#1b2027; color:#fff; padding:10px 16px; border-radius:999px; font-size:13px; transition:.22s; z-index:30; }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  #metrics{ position:absolute; left:-9999px; top:0; visibility:hidden; white-space:nowrap; padding:0; margin:0; border:0; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  @media (max-width:640px){
    .title{ width:120px; font-size:16px; }
    .stage{ padding:10px 8px 20px; }
    .sheet{ padding:10px 12px 16px; border-radius:5px; }
    .fab{ right:14px; bottom:14px; height:46px; padding:0 16px; }
  }

  /* ---------- print ---------- */
  @media print{
    @page{ margin:14mm; }
    html,body{ height:auto; overflow:visible; background:#fff; }
    .bar,.fab,.toast,.rowtools{ display:none !important; }
    .stage{ height:auto; overflow:visible; padding:0; }
    .sheet{ box-shadow:none; border:0; border-radius:0; padding:0; min-height:0; }
    .row{ break-inside:avoid; page-break-inside:avoid; }
    .row + .row{ border-top:0; }
    body:not(.print-ink) #ink{ display:none; }
    .guide:empty::before, .ko:empty::before{ content:none; }
  }
</style>
</head>
<body class="mode-edit snap">

<header class="bar">
  <input class="title" id="title" aria-label="학습지 제목" placeholder="제목" />

  <div class="grp">
    <div class="seg" role="group" aria-label="모드">
      <button id="mEdit"  aria-pressed="true">✏️ 편집</button>
      <button id="mDraw"  aria-pressed="false">🖊️ 필기</button>
    </div>
  </div>

  <div class="grp" id="drawTools" hidden>
    <button class="btn" id="tPen"   aria-pressed="true"  title="펜">✒️</button>
    <button class="btn" id="tErase" aria-pressed="false" title="지우개">🧽</button>
    <span class="lbl">색</span>
    <button class="swatch" data-color="#1b2027" aria-pressed="true"  aria-label="검정"><span style="background:#1b2027"></span></button>
    <button class="swatch" data-color="#e0322b" aria-pressed="false" aria-label="빨강"><span style="background:#e0322b"></span></button>
    <button class="swatch" data-color="#1f6fd0" aria-pressed="false" aria-label="파랑"><span style="background:#1f6fd0"></span></button>
    <button class="swatch" data-color="#1f9457" aria-pressed="false" aria-label="초록"><span style="background:#1f9457"></span></button>
    <span class="lbl">굵기</span>
    <button class="nib" data-w="4"  aria-pressed="false" aria-label="가늘게"><i style="width:5px;height:5px"></i></button>
    <button class="nib" data-w="9"  aria-pressed="true"  aria-label="보통"><i style="width:10px;height:10px"></i></button>
    <button class="nib" data-w="18" aria-pressed="false" aria-label="굵게"><i style="width:16px;height:16px"></i></button>
    <button class="btn" id="undo" title="되돌리기" aria-label="필기 되돌리기" disabled>↩︎</button>
    <button class="btn" id="clearInk" title="필기 전체 지우기" aria-label="필기 전체 지우기">전체 지우기</button>
  </div>

  <div class="grp" id="editTools">
    <span class="lbl">표시 줄 수</span>
    <div class="seg" role="group" id="lineCount" aria-label="한 화면에 보일 문장 수"></div>
    <span class="lbl">예시 농도</span>
    <input class="rng" id="dimAll" type="range" min="0" max="100" step="5" value="100" aria-label="모든 문장 예시 농도" />
  </div>

  <div class="grp end">
    <select class="sel" id="orient" aria-label="인쇄 용지 방향">
      <option value="portrait">A4 세로</option>
      <option value="landscape">A4 가로</option>
    </select>
    <button class="btn ghost" id="print" title="인쇄" aria-label="인쇄">🖨</button>
    <button class="btn ghost" id="full" title="전체 화면" aria-label="전체 화면">⛶</button>
    <span class="dot" id="dot" role="status" aria-label="저장 상태"></span>
  </div>
</header>

<main class="stage" id="stage">
  <div class="sheet" id="sheet">
    <div id="rows"></div>
    <canvas id="ink" aria-label="필기 판서 영역"></canvas>
  </div>
</main>

<button class="fab" id="addRow">＋ 문장 추가</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="metrics" aria-hidden="true"></div>
<style id="pageRule">@page{ size:A4 portrait; }</style>

<script>
'use strict';
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const clamp = (lo, v, hi) => Math.min(hi, Math.max(lo, v));

/* ================= state ================= */
const STORE = 'ehw.v2';
const DEFAULTS = () => ({
  title: '오늘의 문장',
  lines: 1,
  rows: [
    { en:'The apple is red.',      ko:'그 사과는 빨간색입니다.',        dim:100 },
    { en:'I like reading books.',  ko:'나는 책 읽는 것을 좋아합니다.',  dim:100 },
    { en:'This is my classroom.',  ko:'여기는 나의 교실입니다.',        dim:100 }
  ]
});

let state = load();

function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(!raw) return DEFAULTS();
    const p = JSON.parse(raw);
    if(!p || !Array.isArray(p.rows) || !p.rows.length) return DEFAULTS();
    return {
      title: typeof p.title === 'string' ? p.title : '오늘의 문장',
      lines: clamp(1, Number(p.lines) || 1, 5),
      rows: p.rows.map(r => ({
        en: String(r && r.en || ''),
        ko: String(r && r.ko || ''),
        dim: clamp(0, Number(r && r.dim), 100) || (r && r.dim === 0 ? 0 : 100)
      }))
    };
  }catch(e){ return DEFAULTS(); }
}

let saveTimer = null;
function save(){
  $('#dot').classList.add('pending');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
    $('#dot').classList.remove('pending');
  }, 300);
}

let toastTimer = null;
function notify(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
}

/* ================= font metrics ================= */
/* Measure the real ink extents of the practice face so the four rules can be
   derived from the font instead of hard-coded percentages. */
const FONT = 'Andika, Georgia, "Times New Roman", serif';
let FM = null;   // { a, x, d, cap }  — normalised to font-size 1

function measureFont(){
  const P = 200;
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = `400 ${P}px ${FONT}`;
  const asc = s => ctx.measureText(s).actualBoundingBoxAscent;
  const dsc = s => ctx.measureText(s).actualBoundingBoxDescent;
  const cap = asc('H');
  // The top rule is the CAPITAL line — that is how 4선 is taught here, so an
  // uppercase letter fills the top zone exactly. Andika's ascenders run ~11%
  // taller than its capitals and therefore rise past it; the gap between
  // blocks is sized below to swallow that instead of letting them collide.
  const ascender = Math.max(cap, asc('bdfhklt'));
  // flat-topped letters only. Round tops (a c e o s) and arch shoulders (n m r)
  // overshoot x-height by ~1.5% by design, so they must not set the rule.
  const x = asc('xzvwu');
  const d = Math.max(dsc('gjpqy'), P * 0.12);   // guard against fonts reporting ~0
  FM = { cap:cap/P, ascender:ascender/P, x:x/P, d:d/P };
}

/* Where the baseline actually falls inside a line box of the given metrics.
   A zero-height inline-block sits with its bottom edge on the baseline. */
function baselineInLineBox(fontPx, linePx){
  const m = $('#metrics');
  m.style.font = `400 ${fontPx}px/${linePx}px ${FONT}`;
  m.textContent = '';
  const probe = document.createElement('span');
  probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
  m.appendChild(probe);
  m.appendChild(document.createTextNode('Hxy'));
  const off = probe.getBoundingClientRect().top - m.getBoundingClientRect().top;
  m.textContent = '';
  return off;
}

/* ================= layout ================= */
const root = document.documentElement;
let GEO = { band:120, blockH:104, F:64, L2:40, L3:80, rowH:200 };

/* band = F * K — the four-rule block plus the gap under it. The gap must be at
   least as deep as the ascender overshoot, or the next line's b/d/f/h/k/l would
   cut through this block's bottom rule. */
const K = () => {
  const block = FM.cap + FM.d;
  return block + Math.max(0.163 * block, (FM.ascender - FM.cap) + 0.06);
};

const measureCtx = document.createElement('canvas').getContext('2d');
function widthAtSize1(text){
  measureCtx.font = `400 100px ${FONT}`;
  return measureCtx.measureText(text || '').width / 100;
}

/* The ruling has to satisfy two budgets at once: the vertical slot the row owns,
   and the width of the sheet. Pick the largest size that fits the longest
   sentence in at most `maxWrap` ruled lines. */
function computeGeometry(rowBudget, availW, maxWrap){
  const W1 = Math.max(0.05, ...state.rows.map(r => widthAtSize1(r.en || 'Type a sentence…')));
  const k = K();
  let F = 0;
  for(let n = 1; n <= maxWrap; n++){
    F = Math.max(F, Math.min(n * availW / W1, rowBudget / (n * k)));
  }
  F = clamp(16, F, 320);
  const band   = F * k;
  const blockH = F * (FM.cap + FM.d);
  return { band, blockH, F, L2:(FM.cap - FM.x) * F, L3:FM.cap * F };
}

function layout(opts){
  if(!FM) return;
  const printing = !!(opts && opts.print);
  const stage = $('#stage');
  const probe = $('.guide');
  const availW = (probe ? probe.clientWidth : $('#sheet').clientWidth - 52) * 0.97;

  const rowH = printing
    ? 190
    : Math.max(150, (stage.clientHeight - 40) / state.lines - 14);

  // give the Korean gloss only what it needs; the four rules get everything else.
  // availW/14 keeps a typical gloss on one line instead of wrapping on phones.
  const koPx = clamp(20, Math.min(rowH * 0.30 * 0.52, availW / 14), 64);
  const guideBudget = Math.max(90, rowH - (koPx * 1.35 + 12));

  const g = computeGeometry(guideBudget, availW, printing ? 3 : (state.lines === 1 ? 3 : 2));
  GEO = Object.assign(g, { rowH });

  // The baseline rule is painted at (O + L3); park it on the line box's real
  // baseline so every wrapped line inherits the same alignment.
  const bo = baselineInLineBox(g.F, g.band);
  const O  = ((bo - g.L3) % g.band + g.band) % g.band;
  const p  = n => `0 ${n.toFixed(2)}px`;

  root.style.setProperty('--F', g.F.toFixed(2) + 'px');
  root.style.setProperty('--band', g.band.toFixed(2) + 'px');
  root.style.setProperty('--gpos',
    [ p(O), p(O + g.L2), p(O + g.L3), p(O + g.blockH - 2) ].join(', '));
  root.style.setProperty('--ko', koPx.toFixed(1) + 'px');
  root.style.setProperty('--rowH', printing ? 'auto' : rowH.toFixed(0) + 'px');

  sizeCanvas();
}

/* ================= rows ================= */
const rowsEl = $('#rows');

function applyDim(row, i){
  const el = row.querySelector('.guide');
  const v  = state.rows[i].dim;
  const eff = (document.activeElement === el) ? Math.max(v, 35) : v;
  el.style.color = `rgba(17, 20, 26, ${eff / 100})`;
}

function makeRow(item, i){
  const row = document.createElement('div');
  row.className = 'row';

  const en = document.createElement('div');
  en.className = 'guide';
  en.lang = 'en';
  en.spellcheck = false;
  en.setAttribute('role', 'textbox');
  en.setAttribute('aria-label', `영어 문장 ${i + 1}`);
  en.dataset.ph = 'Type a sentence…';
  setEditable(en);
  en.textContent = item.en;                     // textContent — never innerHTML

  const ko = document.createElement('div');
  ko.className = 'ko';
  ko.setAttribute('role', 'textbox');
  ko.setAttribute('aria-label', `한글 뜻 ${i + 1}`);
  ko.dataset.ph = '한글 뜻';
  setEditable(ko);
  ko.textContent = item.ko;

  const tools = document.createElement('div');
  tools.className = 'rowtools';

  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = String(i + 1).padStart(2, '0');

  const dim = document.createElement('input');
  dim.type = 'range'; dim.className = 'rng';
  dim.min = 0; dim.max = 100; dim.step = 5; dim.value = item.dim;
  dim.title = '예시 농도 (0 숨김 · 30 회색 · 100 검정)';
  dim.setAttribute('aria-label', `문장 ${i + 1} 예시 농도`);

  const speak = mkBtn('🔊', `문장 ${i + 1} 읽기`);
  const del   = mkBtn('✕',  `문장 ${i + 1} 삭제`);

  tools.append(num, dim, speak, del);
  row.append(tools, en, ko);

  /* --- behaviour --- */
  en.addEventListener('input', () => { state.rows[i].en = en.textContent; save(); });
  ko.addEventListener('input', () => { state.rows[i].ko = ko.textContent; save(); });
  en.addEventListener('focus', () => applyDim(row, i));
  en.addEventListener('blur',  () => applyDim(row, i));
  [en, ko].forEach(el => el.addEventListener('paste', onPastePlain));

  dim.addEventListener('input', () => {
    const v = Number(dim.value);
    state.rows[i].dim = v;
    // snap to the three meaningful stops so the teacher can hit them reliably
    if(v > 0 && v < 15) dim.value = state.rows[i].dim = 0;
    else if(v >= 25 && v <= 35) dim.value = state.rows[i].dim = 30;
    else if(v > 92) dim.value = state.rows[i].dim = 100;
    applyDim(row, i); save();
  });

  speak.onclick = () => speakText(state.rows[i].en);
  del.onclick = () => {
    if(state.rows.length <= 1){ notify('마지막 문장은 삭제할 수 없어요.'); return; }
    state.rows.splice(i, 1); render(); save(); notify('문장을 삭제했어요.');
  };

  applyDim(row, i);
  return row;
}

function mkBtn(glyph, label){
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = glyph;
  b.title = label; b.setAttribute('aria-label', label);
  return b;
}

function setEditable(el){
  el.setAttribute('contenteditable', 'plaintext-only');
  // Firefox < 136 rejects plaintext-only and reports "inherit"
  if(el.contentEditable !== 'plaintext-only') el.setAttribute('contenteditable', 'true');
}

function onPastePlain(e){
  const txt = (e.clipboardData || window.clipboardData).getData('text/plain');
  e.preventDefault();
  document.execCommand('insertText', false, txt.replace(/\s*\n\s*/g, ' '));
}

function render(){
  rowsEl.textContent = '';
  state.rows.forEach((r, i) => rowsEl.appendChild(makeRow(r, i)));
  layout();
}

/* ================= speech (secondary feature) ================= */
function speakText(text){
  if(!text.trim()) return notify('읽을 문장을 먼저 입력하세요.');
  if(!('speechSynthesis' in window)) return notify('이 브라우저는 음성을 지원하지 않아요.');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.85;
  speechSynthesis.speak(u);
  notify('문장을 읽고 있어요');
}

/* ================= ink ================= */
const canvas = $('#ink');
const cx = canvas.getContext('2d');
let strokes = [];            // { color, w, pts:[{x,y}] }  — document coordinates
let history = [];            // snapshots for undo
let cur = null;
let tool = 'pen', penColor = '#1b2027', penW = 9;

function sizeCanvas(){
  const sheet = $('#sheet');
  const w = sheet.offsetWidth, h = sheet.offsetHeight;
  if(!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}

function redraw(){
  cx.clearRect(0, 0, canvas.width, canvas.height);
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  for(const s of strokes) drawStroke(s);
}

function drawStroke(s){
  const p = s.pts;
  cx.strokeStyle = s.color; cx.lineWidth = s.w;
  cx.beginPath();
  if(p.length === 1){
    cx.arc(p[0].x, p[0].y, s.w / 2, 0, Math.PI * 2);
    cx.fillStyle = s.color; cx.fill();
    return;
  }
  cx.moveTo(p[0].x, p[0].y);
  for(let i = 1; i < p.length - 1; i++){
    const m = { x:(p[i].x + p[i+1].x) / 2, y:(p[i].y + p[i+1].y) / 2 };
    cx.quadraticCurveTo(p[i].x, p[i].y, m.x, m.y);   // midpoint smoothing
  }
  cx.lineTo(p[p.length-1].x, p[p.length-1].y);
  cx.stroke();
}

function ptOf(e){
  const r = canvas.getBoundingClientRect();
  return { x:e.clientX - r.left, y:e.clientY - r.top };
}

function pushHistory(){
  history.push(strokes.map(s => ({ color:s.color, w:s.w, pts:s.pts })));
  if(history.length > 60) history.shift();
  $('#undo').disabled = false;
}

function eraseAt(p){
  const R = 22;
  const before = strokes.length;
  strokes = strokes.filter(s => !s.pts.some(q => Math.hypot(q.x - p.x, q.y - p.y) < R + s.w / 2));
  if(strokes.length !== before) redraw();
  return strokes.length !== before;
}

canvas.addEventListener('pointerdown', e => {
  if(!document.body.classList.contains('mode-draw')) return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  const p = ptOf(e);
  if(tool === 'erase'){ pushHistory(); eraseAt(p); cur = { erasing:true }; return; }
  pushHistory();
  cur = { color:penColor, w:penW, pts:[p] };
  strokes.push(cur);
  drawStroke(cur);
});

canvas.addEventListener('pointermove', e => {
  if(!cur) return;
  e.preventDefault();
  if(cur.erasing){ eraseAt(ptOf(e)); return; }
  const evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for(const ev of evts) cur.pts.push(ptOf(ev));
  redraw();
});

function endStroke(e){
  if(!cur) return;
  if(e && canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  cur = null;
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);   // note: NOT pointerleave

$('#undo').onclick = () => {
  if(!history.length) return;
  strokes = history.pop();
  $('#undo').disabled = !history.length;
  redraw();
};
$('#clearInk').onclick = () => {
  if(!strokes.length) return notify('지울 필기가 없어요.');
  pushHistory(); strokes = []; redraw(); notify('필기를 모두 지웠어요.');
};

/* ================= toolbar wiring ================= */
function setMode(m){
  document.body.classList.toggle('mode-draw', m === 'draw');
  document.body.classList.toggle('mode-edit', m === 'edit');
  $('#mEdit').setAttribute('aria-pressed', String(m === 'edit'));
  $('#mDraw').setAttribute('aria-pressed', String(m === 'draw'));
  $('#drawTools').hidden = (m !== 'draw');
  $('#editTools').hidden = (m === 'draw');
  $$('.guide, .ko').forEach(el => {
    if(m === 'draw') el.setAttribute('contenteditable', 'false');
    else setEditable(el);
  });
  if(m === 'draw' && document.activeElement) document.activeElement.blur();
}
$('#mEdit').onclick = () => setMode('edit');
$('#mDraw').onclick = () => setMode('draw');

$('#tPen').onclick   = () => { tool = 'pen';   $('#tPen').setAttribute('aria-pressed','true');  $('#tErase').setAttribute('aria-pressed','false'); };
$('#tErase').onclick = () => { tool = 'erase'; $('#tPen').setAttribute('aria-pressed','false'); $('#tErase').setAttribute('aria-pressed','true');  };

$$('.swatch').forEach(b => b.onclick = () => {
  penColor = b.dataset.color; tool = 'pen';
  $('#tPen').setAttribute('aria-pressed','true'); $('#tErase').setAttribute('aria-pressed','false');
  $$('.swatch').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
});
$$('.nib').forEach(b => b.onclick = () => {
  penW = Number(b.dataset.w);
  $$('.nib').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
});

/* 표시 줄 수 — this is also the size control: fewer lines ⇒ bigger ruling */
const lc = $('#lineCount');
for(let n = 1; n <= 5; n++){
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = String(n);
  b.setAttribute('aria-label', `한 화면에 ${n}문장`);
  b.setAttribute('aria-pressed', String(n === state.lines));
  b.onclick = () => {
    state.lines = n;
    $$('button', lc).forEach((o, i) => o.setAttribute('aria-pressed', String(i + 1 === n)));
    document.body.classList.toggle('snap', n === 1);
    layout(); save();
  };
  lc.appendChild(b);
}

$('#dimAll').oninput = e => {
  const v = Number(e.target.value);
  state.rows.forEach(r => r.dim = v);
  $$('.rowtools .rng').forEach(r => r.value = v);
  $$('.row').forEach((row, i) => applyDim(row, i));
  save();
};

$('#addRow').onclick = () => {
  state.rows.push({ en:'', ko:'', dim:100 });
  render(); save();
  const last = $$('.guide').pop();
  if(last){ last.focus(); last.scrollIntoView({ behavior:'smooth', block:'center' }); }
};

$('#title').value = state.title;
$('#title').addEventListener('input', e => { state.title = e.target.value; save(); });

$('#orient').onchange = e => {
  $('#pageRule').textContent = `@page{ size:A4 ${e.target.value}; }`;
};

$('#print').onclick = () => window.print();
$('#full').onclick = () => {
  if(document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => notify('전체 화면을 사용할 수 없어요.'));
};

window.addEventListener('beforeprint', () => layout({ print:true }));
window.addEventListener('afterprint',  () => layout());

/* keep geometry in sync with the viewport / rotation */
let roTimer = null;
new ResizeObserver(() => { clearTimeout(roTimer); roTimer = setTimeout(() => layout(), 60); })
  .observe($('#stage'));

/* ================= boot ================= */
async function boot(){
  document.body.classList.toggle('snap', state.lines === 1);
  try{
    await Promise.all([
      document.fonts.load(`400 200px Andika`),
      document.fonts.load(`700 200px Andika`)
    ]);
    await document.fonts.ready;
  }catch(e){ /* fall back to the serif stack */ }
  measureFont();
  render();
  // second pass: the sheet height is only final once rows exist
  requestAnimationFrame(() => { layout(); sizeCanvas(); });
}
boot();

/* Offline support. Guarded on protocol because registering from file:// throws,
   and teachers do open the file directly when testing. */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

/* exposed for the verification harness */
window.__app = {
  get state(){ return state; },
  get geo(){ return GEO; },
  get fm(){ return FM; },
  get strokes(){ return strokes; }
};
</script>
